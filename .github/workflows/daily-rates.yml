name: 매일 환율 스냅샷 자동 갱신
on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC = 09:00 KST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 최신 환율 수집 (open.er-api.com, 키 불필요)
        run: node scripts/fetch-rates.mjs
      - name: 변경 시 커밋·푸시 (→ Netlify 자동 배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          if git diff --staged --quiet; then
            echo "환율 변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 환율 스냅샷 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
